
name: Build mischiefseason for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 360

    steps:
      - name: Prepare folders
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ThirdParty, Libraries, tdesktop | Out-Null

      - name: Download source
        uses: actions/checkout@v4
        with:
          ref: v7.2.9
          submodules: recursive
          path: tdesktop

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Initialize MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: 14.44

      - name: Apply mischiefseason branding
        shell: pwsh
        run: |
          $file = "tdesktop/Telegram/CMakeLists.txt"
          $content = Get-Content $file -Raw
          if ($content -notmatch 'set\(output_name "AyuGram"\)') {
            throw "Could not find AyuGram executable name in CMakeLists.txt"
          }
          $content = $content.Replace('set(output_name "AyuGram")', 'set(output_name "mischiefseason")')
          Set-Content -Path $file -Value $content -NoNewline

          foreach ($file in @(
            "tdesktop/Telegram/Resources/winrc/Telegram.rc",
            "tdesktop/Telegram/Resources/winrc/Updater.rc"
          )) {
            if (Test-Path $file) {
              $content = Get-Content $file -Raw
              $content = $content.Replace("AyuGram Desktop", "mischiefseason")
              $content = $content.Replace("AyuGram", "mischiefseason")
              Set-Content -Path $file -Value $content -NoNewline
            }
          }

      - name: Prepare libraries
        shell: cmd
        run: tdesktop\Telegram\build\prepare\win.bat

      - name: Configure project
        shell: cmd
        working-directory: tdesktop\Telegram
        run: configure.bat x64 -D TDESKTOP_API_ID=2040 -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627

      - name: Build Release
        shell: pwsh
        working-directory: tdesktop
        run: cmake --build out --config Release --target Telegram --parallel 4

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: mischiefseason-windows-x64
          path: tdesktop/out/Release/mischiefseason.exe
          if-no-files-found: error
